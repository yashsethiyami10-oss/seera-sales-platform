name: SEERA Android UAT APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        run: npm ci

      - name: Run non-destructive regression suite
        run: npx vitest run --config vitest.static.config.ts __tests__/seera-foundation/android-native-camera-regression.test.ts __tests__/seera-foundation/field-bilingual-errors.test.ts __tests__/seera-foundation/start-day-gps-isolation.test.ts __tests__/seera-foundation/field-workday-visit-scope-regression.test.ts __tests__/seera-foundation/money-desk-founder-finalization.test.ts __tests__/seera-phase-4-delivery-returns.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production web build
        run: npm run build

      - name: Sync Capacitor Android plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK with commit identity
        # The artifact name (and the APK's own filename) must change on every build. A fixed name
        # across every run is exactly how a Founder ends up reinstalling a stale download from
        # their Downloads folder while believing they have the latest fixes — "fixes appearing in
        # one build but not another" is the direct symptom. Embedding the short SHA in both the
        # artifact name AND the .apk filename itself means a stale local file is visibly different
        # from a fresh one, even after unzipping, with no change to what actually gets built.
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/seera-uat-v1.0.2-${SHORT_SHA}.apk"
          echo "APK_NAME=seera-uat-v1.0.2-${SHORT_SHA}.apk" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Upload UAT APK
        uses: actions/upload-artifact@v4
        with:
          name: seera-android-uat-v1.0.2-${{ env.SHORT_SHA }}
          path: android/app/build/outputs/apk/debug/${{ env.APK_NAME }}
          if-no-files-found: error
